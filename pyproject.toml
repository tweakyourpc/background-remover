[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgvanish"
version = "0.4.3"
description = "Remove image backgrounds locally - no uploads, no account, no fees"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Chris Davis"}]
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "Pillow>=10.0",
  "rembg>=2.0",
  "onnxruntime>=1.17",
]

[project.scripts]
background-remover = "background_remover:main"

[tool.setuptools.packages.find]
where = ["src"]
