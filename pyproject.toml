[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "background-remover"
version = "0.3.0"
description = "Portable background remover app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "Pillow>=10.0",
  "rembg>=2.0",
  "onnxruntime>=1.17",
]

[project.scripts]
background-remover = "app:main"

[tool.setuptools]
py-modules = ["app"]
